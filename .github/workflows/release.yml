name: release

# 触发：
#   1) 推送 v* 形态的 tag（如 v0.1.0）→ 构建双平台安装包并发布 GitHub Release
#   2) Actions 页面手动运行（workflow_dispatch）→ 只构建并上传产物到运行记录，不发布 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 发布 Release 需要 contents 写权限（GITHUB_TOKEN 自动提供）
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：universal 同时覆盖 Intel 与 Apple Silicon
          - os: macos-latest
            label: macos
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Windows：x64（覆盖绝大多数 PC）
          - os: windows-latest
            label: windows
            args: ''
            targets: 'x86_64-pc-windows-msvc'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable) + targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install JS deps
        run: npm ci

      - name: Build & bundle
        run: npm run tauri build -- ${{ matrix.args }}
        # 未配置签名密钥时产出未签名安装包（仍可用，仅 Gatekeeper/SmartScreen 有提示）。
        # 如需签名/公证，在此处 env 引用仓库 secrets：
        #   macOS 公证: APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        #   Windows 代码签名: 把证书与密码配置后通过 tauri 的 signing 机制注入
        env:
          CI: ''

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe

  release:
    name: publish release
    needs: build
    # 仅 tag 推送时发布；手动触发只构建不出 Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
